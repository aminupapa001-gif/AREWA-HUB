<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREWA HUB - Register</title>
</head>

<body>

  <h1>📝 AREWA HUB</h1>

  <h2>Create Account</h2>

  <form>
    <label>Full Name</label><br>
    <input type="text" placeholder="Enter your full name"><br><br>

    <label>Phone Number</label><br>
    <input type="tel" placeholder="Enter phone number"><br><br>

    <label>Email</label><br>
    <input type="email" placeholder="Enter email"><br><br>

    <label>Password</label><br>
    <input type="password" placeholder="Create password"><br><br>

    <label>Account Type</label><br>
    <select>
      <option>Buyer</option>
      <option>Seller</option>
      <option>Service Provider</option>
      <option>Delivery Agent</option>
    </select><br><br>

    <button type="submit">Create Account</button>
  </form>

</body>
</html>
