<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREWA HUB - Checkout</title>
</head>

<body>

  <h1>💳 AREWA HUB</h1>

  <h2>Checkout</h2>

  <h3>Order Summary</h3>

  <p>Product: Product Name</p>
  <p>Quantity: 1</p>
  <p>Product Price: ₦0</p>
  <p>Delivery Fee: ₦0</p>
  <p><strong>Total: ₦0</strong></p>

  <h3>Delivery Information</h3>

  <label>Full Name</label><br>
  <input type="text" placeholder="Enter full name"><br><br>

  <label>Phone Number</label><br>
  <input type="tel" placeholder="Enter phone number"><br><br>

  <label>Delivery Address</label><br>
  <textarea placeholder="Enter delivery address"></textarea><br><br>

  <h3>Payment</h3>

  <button>Proceed to Payment</button>

</body>
</html>
