<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREWA HUB - Buyer Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>🛍️ AREWA HUB</h1>

  <h2>Buyer Dashboard</h2>

  <div class="card">

    <h3>👤 Welcome</h3>

    <p id="buyerName">
      Loading...
    </p>

    <p id="buyerPhone"></p>

    <p id="buyerLocation"></p>


    <button onclick="window.location.href='products.html'">
      🛍️ Browse Products
    </button>


    <button onclick="window.location.href='cart.html'">
      🛒 My Cart
    </button>


    <button onclick="window.location.href='orders.html'">
      📦 My Orders
    </button>


    <button onclick="logout()">
      🚪 Logout
    </button>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ffjofoeiwaiyxecbeuwt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function loadBuyer() {

      const name =
        document.getElementById("buyerName");

      const phone =
        document.getElementById("buyerPhone");

      const location =
        document.getElementById("buyerLocation");


      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.auth.getSession();


      if (
        sessionError ||
        !sessionData.session
      ) {

        window.location.href =
          "buyer_login.html";

        return;
      }


      const user =
        sessionData.session.user;


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "full_name, phone, location, role"
          )
          .eq("user_id", user.id)
          .maybeSingle();


      if (profileError) {

        console.log(profileError);

        name.textContent =
          "Failed to load buyer profile.";

        return;
      }


      if (!profile) {

        name.textContent =
          "Buyer profile not found.";

        return;
      }


      if (
        String(profile.role).toLowerCase()
        !== "buyer"
      ) {

        name.textContent =
          "This is not a buyer account.";

        return;
      }


      name.textContent =
        "Welcome, " +
        profile.full_name +
        " 👋";


      phone.textContent =
        "📞 " +
        profile.phone;


      location.textContent =
        "📍 " +
        profile.location;

    }


    async function logout() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "buyer_login.html";

    }


    loadBuyer();

  </script>

</body>
</html>
