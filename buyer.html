<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREWA HUB - Buyer Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      color: #075e54;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #075e54;
    }

    .service-button {
      background: #0b7a3b;
    }

    .delivery-button {
      background: #1565c0;
    }

    .message-button {
      background: #6a1b9a;
    }

    .logout-button {
      background: #b71c1c;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛍️ AREWA HUB</h1>

  <h2>Buyer Dashboard</h2>

  <div class="card">

    <h3>👤 Welcome</h3>

    <p id="buyerName">
      Loading...
    </p>

    <p id="buyerPhone"></p>

    <p id="buyerLocation"></p>


    <!-- PRODUCTS -->

    <button onclick="window.location.href='products.html'">
      🛍️ Browse Products
    </button>


    <!-- CART -->

    <button onclick="window.location.href='cart.html'">
      🛒 My Cart
    </button>


    <!-- SERVICES -->

    <button
      class="service-button"
      onclick="window.location.href='services.html'">

      🛠️ Find a Service

    </button>


    <!-- ORDERS -->

    <button onclick="window.location.href='orders.html'">
      📦 My Orders
    </button>


    <!-- DELIVERY -->

    <button
      class="delivery-button"
      onclick="window.location.href='delivery.html'">

      🚚 Track Delivery

    </button>


    <!-- MESSAGES -->

<button
  class="message-button"
  onclick="window.location.href='chat-inbox.html'">

  💬 Messages
  <span id="unreadBadge"
    style="
      display:none;
      background:#e53935;
      color:white;
      padding:3px 8px;
      border-radius:20px;
      margin-left:8px;
      font-size:13px;
    ">
  </span>

</button>

    


    <!-- LOGOUT -->

    <button
      class="logout-button"
      onclick="logout()">

      🚪 Logout

    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://ffjofoeiwaiyxecbeuwt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  async function loadBuyer() {

    const name =
      document.getElementById("buyerName");

    const phone =
      document.getElementById("buyerPhone");

    const location =
      document.getElementById("buyerLocation");


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (
      sessionError ||
      !sessionData.session
    ) {

      window.location.href =
        "buyer_login.html";

      return;
    }


    const user =
      sessionData.session.user;


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "full_name, phone, location, role"
        )
        .eq("user_id", user.id)
        .maybeSingle();


    if (profileError) {

      console.log(profileError);

      name.textContent =
        "Failed to load buyer profile.";

      return;
    }


    if (!profile) {

      name.textContent =
        "Buyer profile not found.";

      return;
    }


    if (
      String(profile.role).toLowerCase()
      !== "buyer"
    ) {

      name.textContent =
        "This is not a buyer account.";

      return;
    }


    name.textContent =
      "Welcome, " +
      profile.full_name +
      " 👋";


    phone.textContent =
      "📞 " +
      profile.phone;


    location.textContent =
      "📍 " +
      profile.location;

  }


  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "buyer_login.html";

  }

async function loadUnreadMessages() {

  const {
    data: sessionData
  } = await supabaseClient.auth.getSession();

  if (!sessionData.session) {
    return;
  }

  const userId =
    sessionData.session.user.id;

  const {
    data: conversations,
    error: conversationError
  } =
    await supabaseClient
      .from("conversations")
      .select("id")
      .or(
        `buyer_id.eq.${userId},seller_id.eq.${userId}`
      );

  if (conversationError) {
    console.log(conversationError);
    return;
  }

  const conversationIds =
    (conversations || []).map(
      c => c.id
    );

  if (conversationIds.length === 0) {
    return;
  }

  const {
    count,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*", {
        count: "exact",
        head: true
      })
      .in(
        "conversation_id",
        conversationIds
      )
      .eq(
        "is_read",
        false
      )
      .neq(
        "sender_id",
        userId
      );

  if (error) {
    console.log(error);
    return;
  }

  const badge =
    document.getElementById(
      "unreadBadge"
    );

  if (count > 0) {

    badge.style.display =
      "inline-block";

    badge.textContent =
      count;

  } else {

    badge.style.display =
      "none";

  }

}

loadBuyer();

loadUnreadMessages();

setInterval(
  loadUnreadMessages,
  5000
);
  loadBuyer();

</script>

</body>
</html>
