<!DOCTYPE html>  <html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>AREWA HUB - Providers</title>    <style>  
    body {  
      font-family: Arial, sans-serif;  
      padding: 20px;  
    }  
  
    .provider-card {  
      border: 1px solid #ddd;  
      border-radius: 12px;  
      padding: 16px;  
      margin: 15px 0;  
      background: #fff;  
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);  
    }  
  
    button {  
      padding: 10px 16px;  
      border: none;  
      border-radius: 8px;  
      cursor: pointer;  
      background: #0b7a3b;  
      color: white;  
      font-weight: bold;  
    }  
  </style>  </head>  <body>    <h1>AREWA HUB</h1>    <h2>Service Providers</h2>    <p id="selectedService"></p>    <div id="providersList">  
    Loading providers...  
  </div>    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <script>  
    const SUPABASE_URL = "https://ffjofoeiwaiyxecbeuwt.supabase.co";  
    const SUPABASE_KEY = "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";  
  
    const supabaseClient = supabase.createClient(  
      SUPABASE_URL,  
      SUPABASE_KEY  
    );  
  
    const params = new URLSearchParams(window.location.search);  
    const service = params.get("service");  
  
    document.getElementById("selectedService").textContent =  
      service  
        ? "Providers for: " + service  
        : "All Service Providers";  
  
    async function loadProviders() {  
  
      const providersList =  
        document.getElementById("providersList");  
  
      let query = supabaseClient  
        .from("provider_profiles")  
        .select("*");  
  
      if (service) {  
        query = query.ilike("service", "%" + service + "%");  
      }  
  
      const { data, error } = await query;  
  
      if (error) {  
        console.log(error);  
  
        providersList.innerHTML =  
          "<p>Unable to load providers.</p>";  
  
        return;  
      }  
  
      providersList.innerHTML = "";  
  
      if (!data || data.length === 0) {  
  
        providersList.innerHTML =  
          "<p>No providers found for this service.</p>";  
  
        return;  
      }  
  
      data.forEach(function(provider) {  
  
        providersList.innerHTML += `  
          <div class="provider-card">  
  
            <h3>🎨 ${provider.full_name}</h3>  
  
            <p>🛠️ ${provider.service}</p>  
  
            <p>📍 ${provider.location}</p>  
  
            <p>⭐ ${provider.rating || "New Provider"}</p>  
  
            <p>📝 ${provider.bio || "No bio available."}</p>  
  
            <p>📞 ${provider.phone}</p>  
  
            <button onclick="window.location.href='contact.html?id=${provider.id}'">  
              Contact Provider  
            </button>  
  
          </div>  
        `;  
  
      });  
    }  
  
    loadProviders();  
  </script>  </body>  
</html
