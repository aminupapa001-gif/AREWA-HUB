<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AREWA HUB - Providers</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f7fa;
    }

    .provider-card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #0b7a3b;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🛠️ AREWA HUB</h1>

  <h2>Service Providers</h2>

  <p id="selectedService">
    Loading...
  </p>

  <div id="providersList">
    Loading providers...
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ffjofoeiwaiyxecbeuwt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const service =
      params.get("service");


    document.getElementById(
      "selectedService"
    ).textContent =
      service
        ? "Providers for: " + service
        : "All Service Providers";


    async function loadProviders() {

      const list =
        document.getElementById(
          "providersList"
        );


      const result =
        await supabaseClient
          .from("provider_profiles")
          .select("*");


      console.log(
        "SUPABASE RESULT:",
        result
      );


      if (result.error) {

        list.innerHTML =
          "<p>❌ ERROR: " +
          result.error.message +
          "</p>";

        return;
      }


      const providers =
        result.data || [];


      if (providers.length === 0) {

        list.innerHTML =
          "<p>❌ Browser received ZERO providers.</p>";

        return;
      }


      list.innerHTML = "";


      providers.forEach(
        function(provider) {

          list.innerHTML += `

            <div class="provider-card">

              <h3>
                👤 ${provider.full_name}
              </h3>

              <p>
                🛠️ Service:
                ${provider.service}
              </p>

              <p>
                📍 Location:
                ${provider.location}
              </p>

              <p>
                📞 Phone:
                ${provider.phone}
              </p>

              <p>
                💬 WhatsApp:
                ${provider.whatsapp}
              </p>

              <p>
                📝 ${provider.bio || ""}
              </p>

              <button
                onclick="
                  window.location.href =
                  'contact.html?id=${provider.id}'
                "
              >
                💬 Contact Provider
              </button>

            </div>

          `;

        }
      );

    }


    loadProviders();

  </script>

</body>

</html>
