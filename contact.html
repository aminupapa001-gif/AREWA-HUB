<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AREWA HUB - Contact Provider</title>


  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1 {
      color: #075e54;
    }

    .provider-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      margin: 10px 0;
      color: #444;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 9px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .chat-button {
      background: #075e54;
    }

    .whatsapp-button {
      background: #128c7e;
    }

    .call-button {
      background: #0b7a3b;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>🏪 AREWA HUB</h1>

  <h2>Contact Provider</h2>


  <div class="card">

    <div id="providerInfo">
      Loading provider...
    </div>

    <p id="message"></p>

  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://ffjofoeiwaiyxecbeuwt.supabase.co";


const SUPABASE_KEY =
"sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



const params =
new URLSearchParams(
  window.location.search
);


const providerId =
params.get("id");


const providerInfo =
document.getElementById(
  "providerInfo"
);


const message =
document.getElementById(
  "message"
);


let providerData = null;



/* ==========================
   LOAD PROVIDER
========================== */

async function loadProvider() {

  if (!providerId) {

    providerInfo.innerHTML =
      "<p>❌ Provider ID not found.</p>";

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("provider_profiles")
    .select("*")
    .eq(
      "id",
      providerId
    )
    .single();


  if (
    error ||
    !data
  ) {

    console.log(error);

    providerInfo.innerHTML =
      "<p>❌ Provider not found.</p>";

    return;

  }


  providerData =
    data;


  let whatsappNumber =
    data.whatsapp
      ? data.whatsapp.replace(
          /\D/g,
          ""
        )
      : "";


  let whatsappInternational =
    whatsappNumber.startsWith("234")
      ? whatsappNumber
      : "234" +
        whatsappNumber.replace(
          /^0/,
          ""
        );


  providerInfo.innerHTML = `

    <div class="provider-name">
      👤 ${data.full_name}
    </div>

    <p class="info">
      🛠️ <strong>Service:</strong>
      ${data.service || ""}
    </p>

    <p class="info">
      📍 <strong>Location:</strong>
      ${data.location || ""}
    </p>

    <p class="info">
      📞 <strong>Phone:</strong>
      ${data.phone || ""}
    </p>

    <p class="info">
      💬 <strong>WhatsApp:</strong>
      ${data.whatsapp || "Not provided"}
    </p>

    <p class="info">
      📝 <strong>About:</strong>
      ${data.bio || "No bio available."}
    </p>


    <button
      class="chat-button"
      id="chatButton"
    >
      💬 Message Provider
    </button>


    ${
      data.phone
      ?
      `
      <a
        href="tel:${data.phone}"
        style="text-decoration:none;"
      >

        <button class="call-button">
          📞 Call Provider
        </button>

      </a>
      `
      :
      ""
    }


    ${
      whatsappNumber
      ?
      `
      <a
        href="https://wa.me/${whatsappInternational}"
        target="_blank"
        style="text-decoration:none;"
      >

        <button class="whatsapp-button">
          💬 WhatsApp Provider
        </button>

      </a>
      `
      :
      ""
    }

  `;


  document
    .getElementById(
      "chatButton"
    )
    .addEventListener(
      "click",
      startChat
    );

}



/* ==========================
   START CHAT
========================== */

async function startChat() {

  if (!providerData) {

    message.textContent =
      "❌ Provider information is not ready.";

    return;

  }


  message.textContent =
    "Checking your account...";


  const {
    data: userData,
    error: userError
  } =
  await supabaseClient.auth.getUser();


  if (
    userError ||
    !userData.user
  ) {

    message.textContent =
      "❌ Please login first.";

    return;

  }


  const currentUserId =
    userData.user.id;


  const providerUserId =
    providerData.user_id;


  if (!providerUserId) {

    message.textContent =
      "❌ This provider has no user ID.";

    return;

  }


  if (
    currentUserId ===
    providerUserId
  ) {

    message.textContent =
      "❌ You cannot message yourself.";

    return;

  }


  message.textContent =
    "Opening chat...";


  /*
    Search for existing conversation
    in either direction.
  */

  const {
    data: existing,
    error: existingError
  } =
  await supabaseClient
    .from("conversations")
    .select("id")
    .or(
      `
      and(
        buyer_id.eq.${currentUserId},
        seller_id.eq.${providerUserId}
      ),
      and(
        buyer_id.eq.${providerUserId},
        seller_id.eq.${currentUserId}
      )
      `
    )
    .limit(1);


  if (existingError) {

    console.log(
      existingError
    );

    message.textContent =
      "❌ Failed to check conversation: " +
      existingError.message;

    return;

  }


  /*
    Conversation already exists
  */

  if (
    existing &&
    existing.length > 0
  ) {

    window.location.href =
      "chat.html?conversation_id=" +
      encodeURIComponent(
        existing[0].id
      );

    return;

  }


  /*
    Create new conversation.

    buyer_id and seller_id are
    simply the two users in the chat.
  */

  const {
    data: newConversation,
    error: conversationError
  } =
  await supabaseClient
    .from("conversations")
    .insert({

      buyer_id:
        currentUserId,

      seller_id:
        providerUserId

    })
    .select()
    .single();


  if (conversationError) {

    console.log(
      conversationError
    );

    message.textContent =
      "❌ Could not start chat: " +
      conversationError.message;

    return;

  }


  /*
    Open chat
  */

  window.location.href =
    "chat.html?conversation_id=" +
    encodeURIComponent(
      newConversation.id
    );

}



/* ==========================
   START
========================== */

loadProvider();

</script>


</body>

</html>
