<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AREWA HUB - Chat</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .chat-container {
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 16px;
      background: #075e54;
      color: white;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .chat-header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 13px;
      border-radius: 14px;
      word-wrap: break-word;
    }

    .mine {
      align-self: flex-end;
      background: #dcf8c6;
    }

    .theirs {
      align-self: flex-start;
      background: #eeeeee;
    }

    .message-time {
      display: block;
      font-size: 10px;
      margin-top: 4px;
      color: #777;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 22px;
      padding: 12px 15px;
      outline: none;
      font-size: 15px;
    }

    #sendButton {
      border: none;
      border-radius: 22px;
      padding: 0 20px;
      background: #075e54;
      color: white;
      font-weight: bold;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

  </style>

</head>


<body>

<div class="chat-container">

  <div class="chat-header">

    <h2 id="chatTitle">
      AREWA HUB Chat
    </h2>

    <p id="chatStatus">
      Connecting...
    </p>

  </div>


  <div id="messages">

    <div class="empty">
      Loading messages...
    </div>

  </div>


  <div class="chat-input">

    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      disabled
    >
      Send
    </button>

  </div>

</div>


<script type="module">

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://ffjofoeiwaiyxecbeuwt.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


const messagesBox =
document.getElementById(
  "messages"
);

const messageInput =
document.getElementById(
  "messageInput"
);

const sendButton =
document.getElementById(
  "sendButton"
);

const chatStatus =
document.getElementById(
  "chatStatus"
);

const chatTitle =
document.getElementById(
  "chatTitle"
);


const params =
new URLSearchParams(
  window.location.search
);


const requestedConversationId =
params.get(
  "conversation_id"
);


const targetUserId =
params.get(
  "user_id"
);


let currentUser = null;

let conversationId = null;

let realtimeChannel = null;


/* =========================================
   CURRENT USER
========================================= */

async function getCurrentUser() {

  const {
    data,
    error
  } =
  await supabase.auth.getUser();


  if (error) {

    console.error(error);

    chatStatus.textContent =
      "Authentication error";

    return null;

  }


  if (!data.user) {

    chatStatus.textContent =
      "Please login first";

    return null;

  }


  return data.user;

}


/* =========================================
   FIND OR CREATE CONVERSATION
========================================= */

async function findOrCreateConversation(
  targetId
) {

  if (!currentUser) {
    return null;
  }


  if (!targetId) {
    return null;
  }


  if (
    targetId ===
    currentUser.id
  ) {

    alert(
      "You cannot chat with yourself."
    );

    return null;

  }


  /*
    Search both directions.

    user A -> user B

    OR

    user B -> user A
  */

  const {
    data,
    error
  } =
  await supabase
    .from("conversations")
    .select("*")
    .or(
      `and(buyer_id.eq.${currentUser.id},seller_id.eq.${targetId}),and(buyer_id.eq.${targetId},seller_id.eq.${currentUser.id})`
    )
    .limit(1);


  if (error) {

    console.error(error);

    chatStatus.textContent =
      "Could not find conversation";

    return null;

  }


  if (
    data &&
    data.length > 0
  ) {

    return data[0];

  }


  /*
    Conversation does not exist.
    Create one.

    IMPORTANT:
    buyer_id and seller_id are now
    simply participant slots.
  */

  const {
    data: created,
    error: createError
  } =
  await supabase
    .from("conversations")
    .insert({

      buyer_id:
        currentUser.id,

      seller_id:
        targetId

    })
    .select()
    .single();


  if (createError) {

    /*
      Another request may have
      created it first.

      Search again.
    */

    console.error(
      "Create conversation error:",
      createError
    );


    const {
      data: retryData
    } =
    await supabase
      .from("conversations")
      .select("*")
      .or(
        `and(buyer_id.eq.${currentUser.id},seller_id.eq.${targetId}),and(buyer_id.eq.${targetId},seller_id.eq.${currentUser.id})`
      )
      .limit(1);


    if (
      retryData &&
      retryData.length > 0
    ) {

      return retryData[0];

    }


    chatStatus.textContent =
      "Could not create conversation";

    return null;

  }


  return created;

}


/* =========================================
   LOAD CONVERSATION
========================================= */

async function initializeChat() {

  currentUser =
    await getCurrentUser();


  if (!currentUser) {

    sendButton.disabled =
      true;

    return;

  }


  let conversation = null;


  /*
    OPTION 1:
    Existing conversation
  */

  if (
    requestedConversationId
  ) {

    const {
      data,
      error
    } =
    await supabase
      .from("conversations")
      .select("*")
      .eq(
        "id",
        requestedConversationId
      )
      .single();


    if (error) {

      console.error(error);

      chatStatus.textContent =
        "Conversation not found";

      return;

    }


    /*
      Security check in frontend
    */

    if (
      data.buyer_id !==
      currentUser.id &&
      data.seller_id !==
      currentUser.id
    ) {

      chatStatus.textContent =
        "You are not part of this conversation";

      return;

    }


    conversation =
      data;

  }


  /*
    OPTION 2:
    Start chat with user
  */

  else if (
    targetUserId
  ) {

    conversation =
      await findOrCreateConversation(
        targetUserId
      );

  }


  /*
    Nothing supplied
  */

  else {

    chatStatus.textContent =
      "No conversation selected";

    sendButton.disabled =
      true;

    return;

  }


  if (!conversation) {
    return;
  }


  conversationId =
    conversation.id;


  chatTitle.textContent =
    "💬 AREWA HUB Chat";


  chatStatus.textContent =
    "Online";


  sendButton.disabled =
    false;


  await loadMessages();


  subscribeToMessages();


  await markMessagesAsRead();


  messageInput.focus();

}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages() {

  if (!conversationId) {
    return;
  }


  const {
    data,
    error
  } =
  await supabase
    .from("messages")
    .select("*")
    .eq(
      "conversation_id",
      conversationId
    )
    .order(
      "created_at",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    chatStatus.textContent =
      "Failed to load messages";

    return;

  }


  messagesBox.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    messagesBox.innerHTML = `
      <div class="empty">
        No messages yet.<br>
        Start the conversation.
      </div>
    `;

    return;

  }


  data.forEach(
    addMessage
  );


  scrollToBottom();

}


/* =========================================
   DISPLAY MESSAGE
========================================= */

function addMessage(
  message
) {

  /*
    Prevent duplicate realtime
    messages.
  */

  const existing =
    document.querySelector(
      `[data-message-id="${message.id}"]`
    );


  if (existing) {
    return;
  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message " +
    (
      message.sender_id ===
      currentUser.id
        ? "mine"
        : "theirs"
    );


  div.dataset.messageId =
    message.id;


  const text =
    document.createElement(
      "div"
    );


  text.textContent =
    message.message;


  const time =
    document.createElement(
      "span"
    );


  time.className =
    "message-time";


  time.textContent =
    new Date(
      message.created_at
    ).toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  div.appendChild(
    text
  );

  div.appendChild(
    time
  );


  messagesBox.appendChild(
    div
  );

}


/* =========================================
   REALTIME
========================================= */

function subscribeToMessages() {

  if (!conversationId) {
    return;
  }


  if (realtimeChannel) {

    supabase.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabase
      .channel(
        "arewa-chat-" +
        conversationId
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          addMessage(
            payload.new
          );

          scrollToBottom();


          if (
            payload.new.sender_id !==
            currentUser.id
          ) {

            markMessagesAsRead();

          }

        }
      )
      .subscribe(
        status => {

          console.log(
            "Realtime:",
            status
          );

        }
      );

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (!text) {
    return;
  }


  if (
    !currentUser ||
    !conversationId
  ) {

    alert(
      "Chat is not ready."
    );

    return;

  }


  sendButton.disabled =
    true;


  const {
    data,
    error
  } =
  await supabase
    .from("messages")
    .insert({

      conversation_id:
        conversationId,

      sender_id:
        currentUser.id,

      message:
        text,

      is_read:
        false

    })
    .select()
    .single();


  if (error) {

    console.error(error);

    alert(
      "Failed to send message: " +
      error.message
    );

  } else {

    /*
      Realtime will normally
      display the message.

      Add locally too in case
      realtime is slightly delayed.
    */

    if (data) {

      addMessage(
        data
      );

      scrollToBottom();

    }


    messageInput.value =
      "";

  }


  sendButton.disabled =
    false;

  messageInput.focus();

}


/* =========================================
   MARK AS READ
========================================= */

async function markMessagesAsRead() {

  if (
    !conversationId ||
    !currentUser
  ) {

    return;

  }


  const {
    error
  } =
  await supabase
    .from("messages")
    .update({
      is_read: true
    })
    .eq(
      "conversation_id",
      conversationId
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );


  if (error) {

    console.log(
      "Read status:",
      error.message
    );

  }

}


/* =========================================
   SCROLL
========================================= */

function scrollToBottom() {

  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


/* =========================================
   EVENTS
========================================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================
   START
========================================= */

initializeChat();


</script>

</body>

  </html>
