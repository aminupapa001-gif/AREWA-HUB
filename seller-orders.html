<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AREWA HUB - Seller Orders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .order {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
    }

    .status {
      background: #eee;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    button {
      padding: 12px 18px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .chat-button {
      background: #075e54;
      color: white;
      font-weight: bold;
    }

    .processing-button {
      background: #ff9800;
      color: white;
    }

    .shipped-button {
      background: #2196f3;
      color: white;
    }
  </style>
</head>

<body>

  <h1>🏪 AREWA HUB</h1>

  <h2>Seller Orders</h2>

  <p id="status">Loading orders...</p>

  <div id="orders"></div>

  <button onclick="goBack()">
    ← Back to Seller Dashboard
  </button>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ffjofoeiwaiyxecbeuwt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // LOAD SELLER ORDERS
    // ==========================================

    async function loadSellerOrders() {

      const status =
        document.getElementById("status");

      const container =
        document.getElementById("orders");


      status.textContent =
        "Loading orders...";


      const {
        data: { user },
        error: authError
      } =
        await supabaseClient.auth.getUser();


      if (authError || !user) {

        status.textContent =
          "❌ Please login as a seller first.";

        return;
      }


      // CHECK SELLER PROFILE

      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select("role")
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();


      if (
        profileError ||
        !profile
      ) {

        status.textContent =
          "❌ Seller profile not found.";

        return;
      }


      if (
        String(profile.role).toLowerCase()
        !== "seller"
      ) {

        status.textContent =
          "❌ Only sellers can view seller orders.";

        return;
      }


      // GET ORDERS

      const {
        data: orders,
        error
      } =
        await supabaseClient
          .from("orders")
          .select(`
            id,
            buyer_id,
            seller_id,
            product_id,
            quantity,
            total_price,
            delivery_address,
            status,
            payment_status,
            created_at,
            products (
              name
            )
          `)
          .eq(
            "seller_id",
            user.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        status.textContent =
          "❌ Failed to load orders: " +
          error.message;

        return;
      }


      container.innerHTML = "";


      if (
        !orders ||
        orders.length === 0
      ) {

        status.textContent =
          "No orders found.";

        return;
      }


      status.textContent =
        "Orders loaded successfully.";


      // ==========================================
      // DISPLAY EACH ORDER
      // ==========================================

      for (const order of orders) {

        let buyerName =
          "Buyer";


        // GET BUYER PROFILE

        const {
          data: buyer,
          error: buyerError
        } =
          await supabaseClient
            .from("profiles")
            .select("full_name")
            .eq(
              "user_id",
              order.buyer_id
            )
            .maybeSingle();


        if (buyerError) {

          console.error(
            "Buyer profile error:",
            buyerError
          );

        }


        if (
          buyer &&
          buyer.full_name
        ) {

          buyerName =
            buyer.full_name;

        }


        const div =
          document.createElement("div");

        div.className =
          "order";


        div.innerHTML = `

          <h3>
            📦 New Order
          </h3>

          <p>
            👤 <strong>Buyer:</strong>
            ${buyerName}
          </p>

          <p>
            🛍️ <strong>Product:</strong>
            ${order.products?.name || "Product"}
          </p>

          <p>
            📦 <strong>Quantity:</strong>
            ${order.quantity}
          </p>

          <p>
            💰 <strong>Total:</strong>
            ₦${Number(
              order.total_price
            ).toLocaleString()}
          </p>

          <p>
            📍 <strong>Delivery Address:</strong>
            ${order.delivery_address}
          </p>

          <p>
            📅 <strong>Order Date:</strong>
            ${new Date(
              order.created_at
            ).toLocaleString()}
          </p>


          <div class="status">

            <p>
              🕐 <strong>Status:</strong>
              ${order.status}
            </p>

            <p>
              💳 <strong>Payment:</strong>
              ${order.payment_status}
            </p>


            <button
              class="chat-button"
              onclick="chatWithBuyer('${order.buyer_id}')"
            >
              💬 Chat Buyer
            </button>


            <br>


            <button
              class="processing-button"
              onclick="updateOrderStatus(
                '${order.id}',
                'processing'
              )"
            >
              📦 Processing
            </button>


            <button
              class="shipped-button"
              onclick="updateOrderStatus(
                '${order.id}',
                'shipped'
              )"
            >
              🚚 Shipped
            </button>

          </div>

        `;


        container.appendChild(div);

      }

    }


    // ==========================================
    // CHAT BUYER
    // ==========================================

    async function chatWithBuyer(
      buyerId
    ) {

      const {
        data: { user },
        error: authError
      } =
        await supabaseClient.auth.getUser();


      if (authError || !user) {

        alert(
          "Please login first."
        );

        return;
      }


      // FIND EXISTING CONVERSATION

      const {
        data: existing,
        error: findError
      } =
        await supabaseClient
          .from("conversations")
          .select("id")
          .eq(
            "buyer_id",
            buyerId
          )
          .eq(
            "seller_id",
            user.id
          )
          .maybeSingle();


      if (findError) {

        alert(
          "❌ Could not find conversation: " +
          findError.message
        );

        return;
      }


      if (existing) {

        window.location.href =
          "chat.html?conversation_id=" +
          existing.id;

        return;
      }


      // CREATE NEW CONVERSATION

      const {
        data: conversation,
        error: createError
      } =
        await supabaseClient
          .from("conversations")
          .insert({

            buyer_id:
              buyerId,

            seller_id:
              user.id

          })
          .select("id")
          .single();


      if (createError) {

        alert(
          "❌ Could not create conversation: " +
          createError.message
        );

        return;
      }


      window.location.href =
        "chat.html?conversation_id=" +
        conversation.id;

    }


    // ==========================================
    // UPDATE ORDER STATUS
    // ==========================================

    async function updateOrderStatus(
      orderId,
      newStatus
    ) {

      const {
        error
      } =
        await supabaseClient
          .from("orders")
          .update({
            status: newStatus
          })
          .eq(
            "id",
            orderId
          );


      if (error) {

        alert(
          "❌ Failed to update order: " +
          error.message
        );

        return;
      }


      alert(
        "✅ Order status updated to " +
        newStatus
      );


      loadSellerOrders();

    }


    // ==========================================
    // BACK
    // ==========================================

    function goBack() {

      window.location.href =
        "seller-dashboard.html";

    }


    // START

    loadSellerOrders();

  </script>

</body>
  </html>
