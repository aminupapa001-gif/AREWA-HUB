<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AREWA HUB - My Orders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .order {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #eee;
      margin-top: 10px;
    }

    button {
      padding: 12px 18px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>📦 AREWA HUB</h1>

  <h2>My Orders</h2>

  <p id="status">Loading orders...</p>

  <div id="orders"></div>

  <button onclick="goBack()">
    ← Back to Buyer Dashboard
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ffjofoeiwaiyxecbeuwt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function loadOrders() {

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("orders");


  

status.textContent =
  "Loading orders...";


  const {
    data: { user },
    error: authError
  } =
    await supabaseClient.auth.getUser();
console.log("AUTH RESULT:", user, authError);

if (authError) {
  alert(
    "AUTH ERROR: " +
    authError.message
  );
  return;
}

  if (authError || !user) {

    status.textContent =
      "❌ Please login as a buyer first.";

    return;
  }


  const {
    data: orders,
    error
  } =
    await supabaseClient
      .from("orders")
      .select(`
  id,
  quantity,
  total_price,
  delivery_address,
  status,
  payment_status,
  created_at,
  product_id
`)
      .eq(
        "buyer_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.log(error);

    status.textContent =
      "❌ Failed to load orders: " +
      error.message;

    return;
  }


  container.innerHTML = "";


  if (!orders || !orders.length) {

    status.textContent =
      "You have no orders yet.";

    return;
  }


  status.textContent =
    "Orders loaded successfully.";


  orders.forEach(
    (order) => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "order-card";


      div.innerHTML = `

        <h3>
          📦 Order
        </h3>

        <p>
          Product:
          ${order.products?.name || "Product"}
        </p>

        <p>
          Quantity:
          ${order.quantity}
        </p>

        <p>
          Total:
          ₦${Number(
            order.total_price
          ).toLocaleString()}
        </p>

        <p>
          Delivery Address:
          ${order.delivery_address}
        </p>

        <p>
          Order Date:
          ${new Date(
            order.created_at
          ).toLocaleString()}
        </p>

        <div class="status">

          <p>
            🕐 Status:
            <strong>
              ${order.status}
            </strong>
          </p>

          <p>
            💳 Payment:
            <strong>
              ${order.payment_status}
            </strong>
          </p>

          ${
            order.payment_status === "unpaid"
            ? `
              <button
                onclick="payForOrder('${order.id}')"
              >
                💳 Pay Now
              </button>
            `
            : ""
          }

          ${
            order.status === "shipped"
            ? `
              <hr>

              <p>
                🚚 Your order has been shipped.
              </p>

              <button
                onclick="confirmReceived('${order.id}')"
              >
                ✅ Confirm Received
              </button>
            `
            : ""
          }

        </div>

      `;


      container.appendChild(div);

    }
  );

    }

  
    async function confirmReceived(orderId) {

  const confirmOrder =
    confirm(
      "Have you received this order?"
    );

  if (!confirmOrder) {
    return;
  }

  const {
    error
  } =
    await supabaseClient.rpc(
      "confirm_order_received",
      {
        p_order_id: orderId
      }
    );

  if (error) {

    alert(
      "❌ Failed to confirm order: " +
      error.message
    );

    return;
  }

  alert(
    "✅ Order received successfully!"
  );

  loadOrders();

}


async function payForOrder(orderId) {

  const confirmPayment =
    confirm(
      "Proceed with test payment for this order?"
    );

  if (!confirmPayment) {
    return;
  }

  window.location.href =
    "payment.html?order_id=" +
    orderId;

}


function goBack() {

  window.location.href =
    "buyer.html";

}


loadOrders();

  </script>

</body>
</html>
