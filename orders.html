<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AREWA HUB - My Orders</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .order {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #eee;
      margin-top: 10px;
    }

    button {
      padding: 12px 18px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .chat-button {
      background: #075e54;
      color: white;
      font-weight: bold;
    }

    .pay-button {
      background: #0066ff;
      color: white;
    }
  </style>
</head>

<body>

  <h1>📦 AREWA HUB</h1>

  <h2>My Orders</h2>

  <p id="status">Loading orders...</p>

  <div id="orders"></div>

  <button onclick="goBack()">
    ← Back to Buyer Dashboard
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ffjofoeiwaiyxecbeuwt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function loadOrders() {

      const status =
        document.getElementById("status");

      const container =
        document.getElementById("orders");

      status.textContent =
        "Loading orders...";


      const {
        data: { user },
        error: authError
      } =
        await supabaseClient.auth.getUser();


      if (authError || !user) {

        status.textContent =
          "❌ Please login as a buyer first.";

        return;
      }


      const {
        data: orders,
        error
      } =
        await supabaseClient
          .from("orders")
          .select(`
            id,
            buyer_id,
            seller_id,
            product_id,
            quantity,
            total_price,
            delivery_address,
            status,
            payment_status,
            created_at,
            products (
              name
            )
          `)
          .eq(
            "buyer_id",
            user.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        status.textContent =
          "❌ Failed to load orders: " +
          error.message;

        return;
      }


      container.innerHTML = "";


      if (!orders || orders.length === 0) {

        status.textContent =
          "You have no orders yet.";

        return;
      }


      status.textContent =
        "Orders loaded successfully.";


      for (const order of orders) {

        let sellerName =
          "Seller";


        // GET SELLER NAME

        const {
          data: seller,
          error: sellerError
        } =
          await supabaseClient
            .from("profiles")
            .select("full_name")
            .eq(
              "user_id",
              order.seller_id
            )
            .maybeSingle();


        if (sellerError) {

          console.error(
            "Seller error:",
            sellerError
          );

        }


        if (
          seller &&
          seller.full_name
        ) {

          sellerName =
            seller.full_name;

        }


        const div =
          document.createElement("div");

        div.className =
          "order";


        div.innerHTML = `

          <h3>
            📦 Order
          </h3>

          <p>
            🛍️ <strong>Product:</strong>
            ${order.products?.name || "Product"}
          </p>

          <p>
            👤 <strong>Seller:</strong>
            ${sellerName}
          </p>

          <p>
            📦 <strong>Quantity:</strong>
            ${order.quantity}
          </p>

          <p>
            💰 <strong>Total:</strong>
            ₦${Number(
              order.total_price
            ).toLocaleString()}
          </p>

          <p>
            📍 <strong>Delivery Address:</strong>
            ${order.delivery_address}
          </p>

          <p>
            📅 <strong>Order Date:</strong>
            ${new Date(
              order.created_at
            ).toLocaleString()}
          </p>

          <div class="status">

            <p>
              🕐 <strong>Status:</strong>
              ${order.status}
            </p>

            <p>
              💳 <strong>Payment:</strong>
              ${order.payment_status}
            </p>

            <button
              class="chat-button"
              onclick="chatWithSeller('${order.seller_id}')"
            >
              💬 Chat Seller
            </button>

            ${
              order.payment_status === "unpaid"
              ? `
                <button
                  class="pay-button"
                  onclick="payForOrder('${order.id}')"
                >
                  💳 Pay Now
                </button>
              `
              : ""
            }

            ${
              order.status === "shipped"
              ? `
                <hr>

                <p>
                  🚚 Your order has been shipped.
                </p>

                <button
                  onclick="confirmReceived('${order.id}')"
                >
                  ✅ Confirm Received
                </button>
              `
              : ""
            }

          </div>

        `;


        container.appendChild(div);

      }

    }


    // ==========================================
    // CHAT SELLER
    // ==========================================

    async function chatWithSeller(
      sellerId
    ) {

      const {
        data: { user },
        error: authError
      } =
        await supabaseClient.auth.getUser();


      if (authError || !user) {

        alert(
          "Please login first."
        );

        return;
      }


      const {
        data: existing,
        error: findError
      } =
        await supabaseClient
          .from("conversations")
          .select("id")
          .eq(
            "buyer_id",
            user.id
          )
          .eq(
            "seller_id",
            sellerId
          )
          .maybeSingle();


      if (findError) {

        alert(
          "❌ Could not find conversation: " +
          findError.message
        );

        return;
      }


      if (existing) {

        window.location.href =
          "chat.html?conversation_id=" +
          existing.id;

        return;
      }


      const {
        data: conversation,
        error: createError
      } =
        await supabaseClient
          .from("conversations")
          .insert({

            buyer_id:
              user.id,

            seller_id:
              sellerId

          })
          .select("id")
          .single();


      if (createError) {

        alert(
          "❌ Could not create conversation: " +
          createError.message
        );

        return;
      }


      window.location.href =
        "chat.html?conversation_id=" +
        conversation.id;

    }


    // ==========================================
    // CONFIRM RECEIVED
    // ==========================================

    async function confirmReceived(
      orderId
    ) {

      const confirmOrder =
        confirm(
          "Have you received this order?"
        );


      if (!confirmOrder) {
        return;
      }


      const {
        error
      } =
        await supabaseClient.rpc(
          "confirm_order_received",
          {
            p_order_id:
              orderId
          }
        );


      if (error) {

        alert(
          "❌ Failed to confirm order: " +
          error.message
        );

        return;
      }


      alert(
        "✅ Order received successfully!"
      );

      loadOrders();

    }


    // ==========================================
    // PAYMENT
    // ==========================================

    async function payForOrder(
      orderId
    ) {

      const confirmPayment =
        confirm(
          "Proceed with test payment for this order?"
        );


      if (!confirmPayment) {
        return;
      }


      window.location.href =
        "payment.html?order_id=" +
        orderId;

    }


    function goBack() {

      window.location.href =
        "buyer-dashboard.html";

    }


    loadOrders();

  </script>

</body>
</html>
