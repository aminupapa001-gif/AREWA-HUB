<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AREWA HUB - Messages</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      color: #075e54;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .conversation {
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .conversation h3 {
      margin: 0 0 8px;
      color: #222;
    }

    .conversation p {
      margin: 6px 0;
      color: #555;
      font-size: 14px;
    }

    .role {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e8f5e9;
      color: #075e54;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .open-button {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #075e54;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: bold;
    }

    .open-button:hover {
      background: #064e46;
    }

    .empty {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>💬 AREWA HUB</h1>

  <div class="subtitle">
    Messages
  </div>

  <p id="status">
    Loading conversations...
  </p>

  <div id="conversationList"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://ffjofoeiwaiyxecbeuwt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const status =
    document.getElementById("status");

  const conversationList =
    document.getElementById(
      "conversationList"
    );


  async function loadConversations() {

    status.textContent =
      "Loading conversations...";


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (
      sessionError ||
      !sessionData.session
    ) {

      status.textContent =
        "Please login first.";

      conversationList.innerHTML = `
        <div class="error">
          🔐 You must login before viewing messages.
        </div>
      `;

      return;
    }


    const currentUser =
      sessionData.session.user;


    /*
      IMPORTANT:

      A conversation belongs to either:

      buyer_id
      OR
      seller_id

      Therefore both are checked.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("conversations")
        .select("*")
        .or(
          `buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Conversation error:",
        error
      );

      status.textContent =
        "";

      conversationList.innerHTML = `
        <div class="error">
          ❌ Failed to load messages.<br><br>
          ${error.message}
        </div>
      `;

      return;
    }


    conversationList.innerHTML = "";


    if (
      !data ||
      data.length === 0
    ) {

      status.textContent = "";

      conversationList.innerHTML = `
        <div class="empty">

          <h3>
            📭 No Messages Yet
          </h3>

          <p>
            Your conversations with buyers,
            sellers or providers will appear here.
          </p>

        </div>
      `;

      return;
    }


    status.textContent =
      data.length +
      " conversation(s)";


    data.forEach(
      function(conversation) {

        /*
          Find the other person
        */

        let otherUserId = null;

        let otherRole = "";


        if (
          conversation.buyer_id ===
          currentUser.id
        ) {

          otherUserId =
            conversation.seller_id;

          otherRole =
            "Seller / Provider";

        } else {

          otherUserId =
            conversation.buyer_id;

          otherRole =
            "Buyer";

        }


        const div =
          document.createElement(
            "div"
          );

        div.className =
          "conversation";


        div.innerHTML = `

          <span class="role">
            ${otherRole}
          </span>

          <h3>
            👤 Conversation
          </h3>

          <p>
            🆔 ${otherUserId || "Unknown user"}
          </p>

          <p>
            🕐 ${conversation.created_at
              ? new Date(
                  conversation.created_at
                ).toLocaleString()
              : "No date"
            }
          </p>

          <a
            class="open-button"
            href="chat.html?conversation_id=${
              conversation.id
            }">

            💬 Open Chat

          </a>

        `;


        conversationList.appendChild(
          div
        );

      }
    );

  }


  /*
    Load conversations
  */

  loadConversations();


  /*
    Refresh inbox every 5 seconds
  */

  setInterval(
    loadConversations,
    5000
  );

</script>

</body>

</html>
