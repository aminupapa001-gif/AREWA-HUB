<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>AREWA HUB - Messages</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.header {
  background: linear-gradient(135deg, #075e54, #0b7a3b);
  color: white;
  padding: 22px;
  border-radius: 0 0 20px 20px;
  margin: -20px -20px 20px -20px;
}

.header h1 {
  margin: 0;
}

.header p {
  margin-bottom: 0;
  opacity: 0.9;
}

.status {
  color: #666;
  margin: 15px 0;
}

.conversation {
  background: white;
  padding: 18px;
  margin: 14px 0;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.user {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #075e54;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  flex-shrink: 0;
}

.user h3 {
  margin: 0;
  color: #075e54;
}

.service {
  color: #666;
  font-size: 14px;
  margin-top: 5px;
}

.time {
  color: #888;
  font-size: 13px;
  margin-top: 12px;
}

.open-button {
  display: block;
  text-align: center;
  text-decoration: none;
  background: #075e54;
  color: white;
  padding: 13px;
  border-radius: 10px;
  margin-top: 14px;
  font-weight: bold;
}

.empty {
  background: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
}

.error {
  background: #ffebee;
  color: #b71c1c;
  padding: 15px;
  border-radius: 10px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  padding: 13px;
  background: #e5f5ef;
  color: #075e54;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}

</style>

</head>


<body>


<div class="container">


<div class="header">

  <h1>💬 AREWA HUB</h1>

  <p>
    Your Conversations
  </p>

</div>


<h2>
  Messages
</h2>


<p
  id="status"
  class="status"
>
  Loading conversations...
</p>


<div id="conversationList"></div>


<a
  href="service-dashboard.html"
  class="back"
>
  ← Back to Provider Dashboard
</a>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://ffjofoeiwaiyxecbeuwt.supabase.co";


const SUPABASE_KEY =
"sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const status =
document.getElementById(
  "status"
);


const list =
document.getElementById(
  "conversationList"
);


/* ==========================
   GET USER NAME
========================== */

async function getUserName(userId) {

  /* FIRST: profiles */

  const {
    data: profile,
    error: profileError
  } =
  await supabaseClient
    .from("profiles")
    .select("full_name")
    .eq(
      "user_id",
      userId
    )
    .maybeSingle();


  if (
    !profileError &&
    profile &&
    profile.full_name
  ) {

    return profile.full_name;

  }


  /* SECOND: provider_profiles */

  const {
    data: provider,
    error: providerError
  } =
  await supabaseClient
    .from("provider_profiles")
    .select("full_name, service")
    .eq(
      "user_id",
      userId
    )
    .maybeSingle();


  if (
    !providerError &&
    provider &&
    provider.full_name
  ) {

    return provider.full_name;

  }


  return "AREWA HUB User";

}


/* ==========================
   LOAD CONVERSATIONS
========================== */

async function loadConversations() {


  const {
    data: sessionData,
    error: sessionError
  } =
  await supabaseClient.auth.getSession();


  if (
    sessionError ||
    !sessionData.session
  ) {

    status.textContent =
      "❌ Please login first.";

    return;

  }


  const currentUser =
    sessionData.session.user;


  /* GET CONVERSATIONS */

  const {
    data,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select(
      "id, buyer_id, seller_id, created_at"
    )
    .or(
      `buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    status.textContent = "";

    list.innerHTML = `

      <div class="error">

        ❌ Failed to load messages:

        <br><br>

        ${error.message}

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  if (
    !data ||
    data.length === 0
  ) {

    status.textContent = "";

    list.innerHTML = `

      <div class="empty">

        <h3>
          📭 No Messages Yet
        </h3>

        <p>
          Your conversations will appear here.
        </p>

      </div>

    `;

    return;

  }


  status.textContent =
    data.length +
    " conversation(s)";


  /* ==========================
     DISPLAY EACH CONVERSATION
  ========================== */

  for (
    const conversation of data
  ) {


    let otherUserId;


    if (
      conversation.buyer_id ===
      currentUser.id
    ) {

      otherUserId =
        conversation.seller_id;

    } else {

      otherUserId =
        conversation.buyer_id;

    }


    /* GET OTHER USER NAME */

    const otherUserName =
      await getUserName(
        otherUserId
      );


    /* CREATE CARD */

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "conversation";


    div.innerHTML = `

      <div class="user">

        <div class="avatar">
          👤
        </div>

        <div>

          <h3>
            ${otherUserName}
          </h3>

          <div class="service">
            💬 AREWA HUB Conversation
          </div>

        </div>

      </div>


      <div class="time">

        🕐 ${
          new Date(
            conversation.created_at
          ).toLocaleString()
        }

      </div>


      <a
        class="open-button"
        href="chat.html?conversation_id=${
          conversation.id
        }"
      >

        💬 Open Chat

      </a>

    `;


    list.appendChild(
      div
    );

  }

}


/* START */

loadConversations();


/* AUTO REFRESH */

setInterval(
  loadConversations,
  5000
);


</script>


</body>

  </html>
