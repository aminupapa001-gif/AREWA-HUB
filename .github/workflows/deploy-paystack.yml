name: Deploy Paystack Transfer Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/paystack-transfer/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        run: supabase functions deploy paystack-transfer --project-ref ffjofoeiwaiyxecbeuwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
