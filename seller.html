<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AREWA HUB - Seller Center</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      color: #075e54;
    }

    button {
      border: none;
      padding: 12px 16px;
      margin: 5px;
      border-radius: 8px;
      background: #075e54;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .chat-box {
      background: white;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .conversation {
      padding: 15px;
      margin-top: 10px;
      background: #f1f1f1;
      border-radius: 10px;
    }

    .conversation button {
      background: #128c7e;
    }

    #status {
      color: #666;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #777;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>🏪 AREWA HUB</h1>

  <h2>Seller Center</h2>

  <p>
    Sell your products to buyers across Northern Nigeria.
  </p>


  <button
    onclick="
      window.location.href='add-product.html'
    "
  >
    ➕ Add Product
  </button>


  <button
    onclick="
      window.location.href='seller-orders.html'
    "
  >
    📦 View Orders
  </button>


  <button
    onclick="
      window.location.href='seller-wallet.html'
    "
  >
    💰 My Wallet
  </button>


  <button
    onclick="
      window.location.href='chat-inbox.html'
    "
  >
    💬 All Messages
  </button>


  <div class="chat-box">

    <h2>
      💬 Messages
    </h2>

    <p id="status">
      Checking messages...
    </p>

    <div id="conversations"></div>

  </div>

</div>


<script type="module">

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://ffjofoeiwaiyxecbeuwt.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


const status =
document.getElementById(
  "status"
);


const conversationsBox =
document.getElementById(
  "conversations"
);


/* =========================================
   LOAD ALL USER CONVERSATIONS
========================================= */

async function loadConversations() {

  try {

    status.textContent =
      "Checking messages...";


    const {
      data: sessionData,
      error: sessionError
    } =
    await supabase.auth.getSession();


    if (
      sessionError ||
      !sessionData.session
    ) {

      status.textContent =
        "❌ Please login first.";

      return;

    }


    const currentUser =
      sessionData.session.user;


    status.textContent =
      "Loading messages...";


    const {
      data: conversations,
      error
    } =
    await supabase
      .from("conversations")
      .select(
        "id, buyer_id, seller_id, created_at"
      )
      .or(
        `buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      status.textContent =
        "❌ Failed to load chats: " +
        error.message;

      return;

    }


    conversationsBox.innerHTML =
      "";


    if (
      !conversations ||
      conversations.length === 0
    ) {

      status.textContent =
        "";


      conversationsBox.innerHTML = `
        <div class="empty">

          📭 No messages yet.

          <br><br>

          When you chat with a buyer,
          seller or provider,
          the conversation will appear here.

        </div>
      `;

      return;

    }


    status.textContent =
      conversations.length +
      " conversation(s)";


    conversations.forEach(
      function(conversation) {


        /*
          Find the other participant
        */

        const otherUserId =
          conversation.buyer_id ===
          currentUser.id

            ? conversation.seller_id

            : conversation.buyer_id;


        const box =
          document.createElement(
            "div"
          );


        box.className =
          "conversation";


        box.innerHTML = `

          <strong>
            💬 AREWA HUB Conversation
          </strong>

          <p>
            👤 User ID:
            ${otherUserId}
          </p>

          <p>
            🕐 ${
              new Date(
                conversation.created_at
              ).toLocaleString()
            }
          </p>

        `;


        const button =
          document.createElement(
            "button"
          );


        button.textContent =
          "💬 Open Chat";


        button.onclick =
          function() {

            window.location.href =
              "chat.html?conversation_id=" +
              encodeURIComponent(
                conversation.id
              );

          };


        box.appendChild(
          button
        );


        conversationsBox.appendChild(
          box
        );

      }
    );


  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Unexpected error: " +
      error.message;

  }

}


loadConversations();


/*
  Refresh messages
*/

setInterval(
  loadConversations,
  5000
);

</script>

</body>

</html>
