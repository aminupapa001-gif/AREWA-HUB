<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AREWA HUB - Provider Registration</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h1 {
      color: #075e54;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0b7a3b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #075e54;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛠️ AREWA HUB</h1>

  <h2>Become a Service Provider</h2>

  <p>
    Register your service and connect with buyers
    across Northern Nigeria.
  </p>

  <form id="providerForm">

    <label>Email</label>

    <input
      type="email"
      id="email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      minlength="6"
      placeholder="Only needed for new account"
    >

    <label>Full Name</label>

    <input
      type="text"
      id="full_name"
      placeholder="e.g. Aminu Ayuba"
      required
    >

    <label>Phone</label>

    <input
      type="tel"
      id="phone"
      placeholder="e.g. 07012345678"
      required
    >

    <label>WhatsApp Number</label>

    <input
      type="tel"
      id="whatsapp"
      placeholder="e.g. 08112345678"
      required
    >

    <label>Service</label>

    <select id="service" required>

      <option value="">
        -- Select Your Service --
      </option>

      <option value="AC Technician">❄️ AC Technician</option>
      <option value="Laundry">🧺 Wanki da Guga / Laundry</option>
      <option value="Cleaning">🧹 Cleaning Service</option>
      <option value="Electrician">🔌 Electrician</option>
      <option value="Plumber">🚰 Plumber</option>
      <option value="Mechanic">🔧 Mechanic</option>
      <option value="Vulcanizer">🛞 Vulcanizer</option>
      <option value="Car Wash">🚗 Car Wash</option>
      <option value="Carpenter">🪚 Carpenter</option>
      <option value="Painter">🎨 Painter</option>
      <option value="Bricklayer">🧱 Bricklayer</option>
      <option value="Construction">🏗️ Aikin Gini / Construction</option>
      <option value="Barber">💈 Barber</option>
      <option value="Makeup Artist">💄 Makeup Artist</option>
      <option value="Tailor">👗 Tailor</option>
      <option value="Catering">🍳 Cook / Catering</option>
      <option value="Cake">🎂 Cake & Pastry</option>
      <option value="Photography">📸 Photography</option>
      <option value="Videography">🎥 Videography</option>
      <option value="Phone Repair">📱 Phone Repair</option>
      <option value="Computer Repair">💻 Computer Repair</option>
      <option value="Web Development">🌐 Web Development</option>
      <option value="Graphic Design">🎨 Graphic Design</option>
      <option value="Digital Marketing">📢 Digital Marketing</option>
      <option value="Delivery">🚚 Delivery</option>
      <option value="Gardening">🌳 Gardening</option>
      <option value="Pest Control">🐜 Pest Control</option>
      <option value="Tutor">📚 Tutor</option>
      <option value="Typing and Printing">📝 Typing & Printing</option>
      <option value="Business Consultant">💼 Business Consultant</option>
      <option value="Partner">🤝 Business Partner</option>

    </select>

    <label>Location</label>

    <input
      type="text"
      id="location"
      placeholder="e.g. Kano State, Zangon Rimi"
      required
    >

    <label>About You</label>

    <textarea
      id="bio"
      rows="5"
      placeholder="Tell buyers about your experience and services..."
    ></textarea>

    <button type="submit">
      Register as Provider
    </button>

  </form>

  <p id="message"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ffjofoeiwaiyxecbeuwt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_JSRFL_7wg3kXrl7CvdmsUA_k_RfWxrF";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("providerForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const message =
        document.getElementById("message");

      message.textContent =
        "Checking your account...";


      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const full_name =
        document
          .getElementById("full_name")
          .value
          .trim();

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();

      const whatsapp =
        document
          .getElementById("whatsapp")
          .value
          .trim();

      const service =
        document
          .getElementById("service")
          .value;

      const location =
        document
          .getElementById("location")
          .value
          .trim();

      const bio =
        document
          .getElementById("bio")
          .value
          .trim();


      /*
        STEP 1
        Check if user is already logged in
      */

      const {
        data: sessionData,
        error: sessionError
      } =
      await supabaseClient.auth.getSession();


      if (sessionError) {

        message.textContent =
          "Session error: " +
          sessionError.message;

        return;
      }


      let currentUser =
        sessionData.session
          ? sessionData.session.user
          : null;


      /*
        STEP 2
        If there is no logged-in user,
        create a new account.
      */

      if (!currentUser) {

        if (!password) {

          message.textContent =
            "Please enter your password.";

          return;
        }


        message.textContent =
          "Creating your account...";


        const {
          data: authData,
          error: authError
        } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });


        if (authError) {

          console.log(authError);

          message.textContent =
            "Account creation failed: " +
            authError.message;

          return;
        }


        if (!authData.user) {

          message.textContent =
            "Account was not created.";

          return;
        }


        currentUser =
          authData.user;


        /*
          If email confirmation is enabled,
          Supabase may not create an active session.
        */

        if (!authData.session) {

          message.textContent =
            "✅ Account created. Please confirm your email, then login and return here to complete your provider profile.";

          return;
        }

      }


      /*
        STEP 3
        Create provider profile.
      */

      message.textContent =
        "Saving provider profile...";


      const {
        data: existingProfile,
        error: checkError
      } =
      await supabaseClient
        .from("provider_profiles")
        .select("id")
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();


      if (checkError) {

        console.log(checkError);

        message.textContent =
          "Could not check provider profile: " +
          checkError.message;

        return;
      }


      /*
        If profile already exists,
        update it instead of creating duplicate.
      */

      if (existingProfile) {

        const {
          error: updateError
        } =
        await supabaseClient
          .from("provider_profiles")
          .update({
            full_name: full_name,
            phone: phone,
            whatsapp: whatsapp,
            service: service,
            location: location,
            bio: bio
          })
          .eq(
            "user_id",
            currentUser.id
          );


        if (updateError) {

          console.log(updateError);

          message.textContent =
            "Provider profile update failed: " +
            updateError.message;

          return;
        }


        message.textContent =
          "✅ Provider profile updated successfully!";

        return;
      }


      /*
        Create new provider profile
      */

      const {
        error: profileError
      } =
      await supabaseClient
        .from("provider_profiles")
        .insert([
          {
            user_id: currentUser.id,
            full_name: full_name,
            phone: phone,
            whatsapp: whatsapp,
            service: service,
            location: location,
            bio: bio
          }
        ]);


      if (profileError) {

        console.log(profileError);

        message.textContent =
          "Provider profile failed: " +
          profileError.message;

        return;
      }


      message.textContent =
  "✅ Provider registration successful!";

setTimeout(function() {
  window.location.href =
    "service-dashboard.html";
}, 1000);

    }
  );

</script>

</body>

</html>
